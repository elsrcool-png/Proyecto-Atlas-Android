name: Build Atlas APK Builder

on:
  push:
    paths:
      - 'atlas-apk-builder/**'
      - '.github/workflows/build-atlas-apk-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-apk-builder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Builder APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-APK-Builder
          path: atlas-apk-builder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
