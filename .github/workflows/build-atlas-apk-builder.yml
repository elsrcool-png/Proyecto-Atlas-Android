name: Build Atlas APK Builder

on:
  push:
    paths:
      - 'atlas-apk-builder/**'
      - '.github/workflows/build-atlas-apk-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-apk-builder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Builder APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Atlas APK Builder size: $SIZE bytes"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          echo "APK structure: OK"
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-APK-Builder-v2
          path: atlas-apk-builder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
