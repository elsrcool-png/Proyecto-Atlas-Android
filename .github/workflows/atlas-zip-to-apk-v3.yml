name: Atlas ZIP to APK v3
run-name: Atlas QA Studio ${{ inputs.version_label }} | Atlas Runtime ${{ inputs.atlas_runtime_version }} | ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        required: true
        type: string
      source_asset_name:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      version_label:
        required: true
        type: string
      atlas_runtime_version:
        required: false
        default: '2.62.8'
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Download and verify source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/work
          mkdir -p /tmp/src /tmp/work
          gh release download '${{ inputs.source_release_tag }}' --repo "$GITHUB_REPOSITORY" --pattern '${{ inputs.source_asset_name }}' --dir /tmp/src
          test -s "/tmp/src/${{ inputs.source_asset_name }}"
          actual=$(sha256sum "/tmp/src/${{ inputs.source_asset_name }}" | awk '{print $1}')
          test "$actual" = '${{ inputs.source_sha256 }}' || { echo "ERROR: source SHA256 mismatch"; exit 1; }
          unzip -q "/tmp/src/${{ inputs.source_asset_name }}" -d /tmp/work
          echo "SOURCE SHA256 PASS: $actual"

      - name: Locate Atlas project
        id: project
        run: |
          set -euo pipefail
          root=''
          while IFS= read -r -d '' p; do
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.build ? 0 : 1)' "$p"; then
              root="$(dirname "$p")"
              break
            fi
          done < <(find /tmp/work -type f -name package.json -not -path '*/node_modules/*' -print0)
          test -n "$root" || { echo 'ERROR: no package.json with build script'; exit 1; }
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "ATLAS ROOT: $root"

      - name: Prepare Node dependencies and Capacitor
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          if ! node -e "const p=require('./package.json'); process.exit((p.dependencies?.['@capacitor/core']||p.devDependencies?.['@capacitor/core']) ? 0 : 1)"; then
            echo 'Capacitor core not declared; installing compatible Capacitor packages for this build.'
            npm install @capacitor/core @capacitor/android @capacitor/cli --no-audit --no-fund
          elif ! test -x node_modules/.bin/cap; then
            npm install @capacitor/core @capacitor/android @capacitor/cli --no-audit --no-fund
          fi
          test -x node_modules/.bin/cap
          npx cap --version

      - name: Build Atlas web application
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          echo 'WEB BUILD PASS'

      - name: Audit and integrate native Atlas QA layer
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          native="$(dirname "$PWD")/native"
          test -d "$native" || { echo "ERROR: native directory not found: $native"; exit 1; }
          test -f "$native/AndroidManifest.xml"
          test -f "$native/com/tittor/atlas/qa/manager/AtlasQaPlugin.java"
          test -f "$native/com/tittor/atlas/qa/manager/MainActivity.java"
          grep -q '@CapacitorPlugin(name="AtlasQa")' "$native/com/tittor/atlas/qa/manager/AtlasQaPlugin.java"
          grep -q 'AtlasQaPlugin.class' "$native/com/tittor/atlas/qa/manager/MainActivity.java"
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/tittor/atlas/qa/manager
          cp -a "$native/com/tittor/atlas/qa/manager/." android/app/src/main/java/com/tittor/atlas/qa/manager/
          if test -d "$native/assets"; then
            mkdir -p android/app/src/main/assets
            cp -a "$native/assets/." android/app/src/main/assets/
          fi
          python - "$native/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text()
          dst=Path(sys.argv[2])
          out=dst.read_text()
          for perm in re.findall(r'<uses-permission[^>]+android:name="([^"]+)"[^>]*/>',src):
              if f'android:name="{perm}"' not in out:
                  out=out.replace('</manifest>',f'    <uses-permission android:name="{perm}" />\n</manifest>')
          for svc in ('ImportService','BuildService'):
              name=f'com.tittor.atlas.qa.manager.{svc}'
              if name in src and name not in out:
                  out=out.replace('</application>',f'    <service android:name="{name}" android:exported="false" android:foregroundServiceType="dataSync" />\n</application>')
          out=out.replace('android:name=".MainActivity"','android:name="com.tittor.atlas.qa.manager.MainActivity"')
          out=out.replace('android:name="MainActivity"','android:name="com.tittor.atlas.qa.manager.MainActivity"')
          dst.write_text(out)
          PY
          python - android/app/build.gradle '${{ inputs.version_label }}' <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); v=sys.argv[2]; s=p.read_text(); a=v.split('.')
          if len(a)!=3 or not all(x.isdigit() for x in a): raise SystemExit('Invalid Studio version')
          code=int(a[0])*10000+int(a[1])*100+int(a[2])
          s=re.sub(r'(?m)^\s*versionCode\s+.*$',f'        versionCode {code}',s,count=1)
          s=re.sub(r'(?m)^\s*versionName\s+.*$',f'        versionName "{v}"',s,count=1)
          p.write_text(s)
          PY
          npx cap sync android
          grep -q 'com.tittor.atlas.qa.manager.MainActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'AtlasQaPlugin.class' android/app/src/main/java/com/tittor/atlas/qa/manager/MainActivity.java
          echo 'NATIVE ATLAS QA PASS'

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile Java and build unsigned APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon
          ./gradlew clean assembleDebug --no-daemon
          apk=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -s "$apk"
          cp "$apk" /tmp/Atlas-unsigned.apk
          echo 'UNSIGNED APK BUILD PASS'

      - name: Validate unsigned APK
        run: |
          set -euo pipefail
          apkanalyzer=$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)
          test -n "$apkanalyzer"
          "$apkanalyzer" manifest application-id /tmp/Atlas-unsigned.apk | grep -q 'com.tittor.atlas.qa'
          "$apkanalyzer" manifest version-name /tmp/Atlas-unsigned.apk | grep -q '${{ inputs.version_label }}'
          echo 'APK VALIDATION PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/Atlas-unsigned.apk
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/unsigned
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Restore Atlas master signing key
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ATLAS_KEYSTORE_BASE64"
          printf '%s' "$ATLAS_KEYSTORE_BASE64" | base64 --decode > /tmp/atlas-release.p12
          test -s /tmp/atlas-release.p12
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Sign release with Atlas master key
        env:
          STORE_PASS: ${{ secrets.ATLAS_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ATLAS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keytool -list -storetype PKCS12 -keystore /tmp/atlas-release.p12 -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          zipalign=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          out="Atlas_QA_Character_Studio_v${{ inputs.version_label }}_Atlas_${{ inputs.atlas_runtime_version }}.apk"
          sha="$out.sha256"
          txt="Atlas_QA_Character_Studio_v${{ inputs.version_label }}_Atlas_${{ inputs.atlas_runtime_version }}.txt"
          "$zipalign" -f -p 4 /tmp/unsigned/Atlas-unsigned.apk /tmp/aligned.apk
          "$apksigner" sign --ks /tmp/atlas-release.p12 --ks-type PKCS12 --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out "$out" /tmp/aligned.apk
          "$apksigner" verify --verbose --print-certs "$out" > /tmp/signature.txt
          sha256sum "$out" > "$sha"
          { echo 'Atlas QA Character Studio'; echo 'Studio version: ${{ inputs.version_label }}'; echo 'Atlas runtime: ${{ inputs.atlas_runtime_version }}'; echo 'Application ID: com.tittor.atlas.qa'; echo 'Signed: yes'; echo "Source SHA256: ${{ inputs.source_sha256 }}"; echo "Workflow run: $GITHUB_RUN_ID"; echo; cat /tmp/signature.txt; } > "$txt"
          gh release upload '${{ inputs.source_release_tag }}' "$out" "$sha" "$txt" --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p /tmp/release
          cp "$out" "$sha" "$txt" /tmp/release/
          echo 'SIGNED RELEASE PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-release-${{ inputs.request_id }}
          path: /tmp/release/*
          retention-days: 30
