name: Construir Atlas Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Validar versión
        shell: bash
        run: |
          VERSION_NAME=$(
            sed -nE 's/.*versionName[[:space:]=]+"([^"]+)".*/\1/p' \
              android/app/build.gradle |
            head -n 1
          )

          SCRIPT="validate:v${VERSION_NAME//./-}"

          if node -e 'const p=require("./package.json"); process.exit((p.scripts||{})[process.argv[1]] ? 0 : 1)' "$SCRIPT"; then
            npm run "$SCRIPT"
          elif node -e 'const p=require("./package.json"); process.exit((p.scripts||{}).validate ? 0 : 1)'; then
            npm run validate
          else
            echo "No hay validación específica; se continúa."
          fi

      - name: Compilar Atlas
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Restaurar firma maestra
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$ATLAS_KEYSTORE_BASE64"
          printf '%s' "$ATLAS_KEYSTORE_BASE64" |
            base64 --decode > android/app/atlas-release.p12
          test -s android/app/atlas-release.p12

      - name: Comprobar firma maestra
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        run: |
          keytool -list \
            -storetype PKCS12 \
            -keystore android/app/atlas-release.p12 \
            -storepass "$ATLAS_STORE_PASSWORD" \
            -alias "$ATLAS_KEY_ALIAS" \
            >/dev/null
          echo "Firma maestra válida"

      - name: Construir APK release firmado
        working-directory: android
        env:
          ATLAS_KEYSTORE_PATH: ${{ github.workspace }}/android/app/atlas-release.p12
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar y nombrar APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          VERSION_NAME=$(
            sed -nE 's/.*versionName[[:space:]=]+"([^"]+)".*/\1/p' \
              android/app/build.gradle |
            head -n 1
          )

          OUT="Atlas-v${VERSION_NAME}-release.apk"
          SIG="Atlas-v${VERSION_NAME}-signature.txt"

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner |
            sort -V |
            tail -n 1
          )

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" |
            tee "$SIG"

          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Publicar APK temporal
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RELEASE_TAG: qa-manager-v3.2.0-${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Atlas-v*-release.apk Atlas-v*-release.apk.sha256 Atlas-v*-signature.txt)
          (( ${#files[@]} > 0 )) || { echo "No encontré salida"; exit 1; }
          gh release create "$QA_RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Atlas QA Studio temporal ${{ github.run_id }}" --notes "Salida temporal" --prerelease
