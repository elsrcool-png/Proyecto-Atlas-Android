name: Construir Atlas Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Validar Atlas v2.20
        run: npm run validate:v2-20

      - name: Compilar Atlas
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Restaurar firma maestra
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$ATLAS_KEYSTORE_BASE64"

          printf '%s' "$ATLAS_KEYSTORE_BASE64" |
            base64 --decode > android/app/atlas-release.p12

          test -s android/app/atlas-release.p12

      - name: Comprobar firma maestra
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        run: |
          keytool -list \
            -storetype PKCS12 \
            -keystore android/app/atlas-release.p12 \
            -storepass "$ATLAS_STORE_PASSWORD" \
            -alias "$ATLAS_KEY_ALIAS" \
            >/dev/null

          echo "Firma maestra válida"

      - name: Construir APK release firmado
        working-directory: android
        env:
          ATLAS_KEYSTORE_PATH: ${{ github.workspace }}/android/app/atlas-release.p12
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner |
            sort -V |
            tail -n 1
          )

          test -n "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" |
            tee Atlas-v2.20-signature.txt

          cp "$APK" Atlas-v2.20-release.apk

          sha256sum \
            Atlas-v2.20-release.apk \
            > Atlas-v2.20-release.apk.sha256

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-v2.20-release
          path: |
            Atlas-v2.20-release.apk
            Atlas-v2.20-release.apk.sha256
            Atlas-v2.20-signature.txt
          if-no-files-found: error
          retention-days: 30
