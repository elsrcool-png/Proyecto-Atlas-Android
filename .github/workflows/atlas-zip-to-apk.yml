name: Atlas ZIP to APK
run-name: Atlas APK ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Temporary release tag containing the source ZIP
        required: true
        type: string
      source_asset_name:
        description: Source ZIP asset name
        required: true
        type: string
      version_label:
        description: Human-readable version label
        required: true
        type: string
      request_id:
        description: Unique build request ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-source /tmp/atlas-work
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_ASSET" --dir /tmp/atlas-source
          test -s "/tmp/atlas-source/$SOURCE_ASSET"
          unzip -q "/tmp/atlas-source/$SOURCE_ASSET" -d /tmp/atlas-work
      - name: Locate Atlas project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          root=""
          while IFS= read -r -d '' pkg; do
            if node -e 'const p=require(process.argv[1]); process.exit((p.scripts && p.scripts.build) ? 0 : 1)' "$pkg"; then
              root="$(dirname "$pkg")"
              break
            fi
          done < <(find /tmp/atlas-work -type f -name package.json -not -path '*/node_modules/*' -print0)
          test -n "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Atlas project root: $root"
          test -f "$root/package.json"
      - name: Install project dependencies
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            npm ci
          else
            npm install
          fi
      - name: Build Atlas web application
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
      - name: Prepare Capacitor Android
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if test -d android && test -f android/gradlew; then
            echo "Existing Android project detected"
          else
            echo "Adding Android platform with Capacitor"
            npx cap add android
          fi
          npx cap sync android
      - name: Build unsigned Android APK
        working-directory: ${{ steps.project.outputs.root }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Locate generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" /tmp/Atlas-unsigned.apk
          test -s /tmp/Atlas-unsigned.apk
          echo "Generated APK: $apk"
          ls -lh /tmp/Atlas-unsigned.apk
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/Atlas-unsigned.apk
          retention-days: 1

  sign-release:
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/unsigned
      - name: Restore Atlas master signing key
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATLAS_KEYSTORE_BASE64"
          printf '%s' "$ATLAS_KEYSTORE_BASE64" | base64 --decode > /tmp/atlas-release.p12
          test -s /tmp/atlas-release.p12
      - name: Verify master signing key
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -storetype PKCS12 -keystore /tmp/atlas-release.p12 -storepass "$ATLAS_STORE_PASSWORD" -alias "$ATLAS_KEY_ALIAS" >/dev/null
      - name: Sign APK with Atlas key
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/unsigned/Atlas-unsigned.apk
          ALIGNED=/tmp/Atlas-aligned.apk
          OUT="Atlas-v${{ inputs.version_label }}-release.apk"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign --ks /tmp/atlas-release.p12 --ks-type PKCS12 --ks-pass "pass:$ATLAS_STORE_PASSWORD" --key-pass "pass:$ATLAS_KEY_PASSWORD" --ks-key-alias "$ATLAS_KEY_ALIAS" --out "$OUT" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "Atlas-v${{ inputs.version_label }}-signature.txt"
          sha256sum "$OUT" > "${OUT}.sha256"
          test -s "$OUT"
      - name: Publish signed APK to source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ inputs.source_release_tag }}' "Atlas-v${{ inputs.version_label }}-release.apk" "Atlas-v${{ inputs.version_label }}-release.apk.sha256" "Atlas-v${{ inputs.version_label }}-signature.txt" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-release-${{ inputs.request_id }}
          path: |
            Atlas-v${{ inputs.version_label }}-release.apk
            Atlas-v${{ inputs.version_label }}-release.apk.sha256
            Atlas-v${{ inputs.version_label }}-signature.txt
          retention-days: 7
