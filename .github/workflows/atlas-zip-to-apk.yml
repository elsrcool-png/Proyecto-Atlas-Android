name: Atlas ZIP to APK
run-name: Atlas APK ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Temporary release tag containing the source ZIP
        required: true
        type: string
      source_asset_name:
        description: Source ZIP asset name
        required: true
        type: string
      version_label:
        description: Exact Atlas QA Studio version to build
        required: true
        type: string
      request_id:
        description: Unique build request ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/atlas-source /tmp/atlas-work
          mkdir -p /tmp/atlas-source /tmp/atlas-work
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_ASSET" --dir /tmp/atlas-source
          test -s "/tmp/atlas-source/$SOURCE_ASSET"
          unzip -q "/tmp/atlas-source/$SOURCE_ASSET" -d /tmp/atlas-work
      - name: Locate and audit source package
        id: project
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find /tmp/atlas-work -type f -name package.json -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 dirname | sort -u)
          ((${#candidates[@]} > 0)) || { echo 'ERROR: package.json not found'; exit 1; }
          root=''
          for candidate in "${candidates[@]}"; do
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.build ? 0 : 1)' "$candidate/package.json"; then root="$candidate"; break; fi
          done
          test -n "$root" || { echo 'ERROR: no web project with build script'; exit 1; }
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Atlas web root: $root"
          node - "$root/package.json" "$VERSION_LABEL" <<'NODE'
          const fs=require('fs');
          const [file, expected]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          if(p.version!==expected) throw new Error(`VERSION_MISMATCH package=${p.version} requested=${expected}`);
          if(p.name!=='atlas-qa-character-studio') throw new Error(`Unexpected package name: ${p.name}`);
          if(!p.dependencies?.['@capacitor/core'] || !p.devDependencies?.['@capacitor/android'] || !p.devDependencies?.['@capacitor/cli']) throw new Error('Capacitor dependencies missing');
          NODE
          node - "$root/capacitor.config.json" <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(p.appId!=='com.tittor.atlas.qa') throw new Error(`Unexpected appId: ${p.appId}`);
          if(p.appName!=='Atlas QA Studio') throw new Error(`Unexpected appName: ${p.appName}`);
          if(p.webDir!=='dist') throw new Error(`Unexpected webDir: ${p.webDir}`);
          NODE
          if grep -RniE 'AtlasPublishQa|PublishQa' "$root" --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' >/tmp/atlas-forbidden.txt 2>/dev/null; then cat /tmp/atlas-forbidden.txt; echo 'ERROR: forbidden AtlasPublishQa implementation/reference detected'; exit 1; fi
          native="$(dirname "$root")/native"
          test -d "$native" || { echo 'ERROR: native/ directory missing beside web/'; exit 1; }
          test -f "$native/AndroidManifest.xml"
          java_count=$(find "$native" -type f -name '*.java' | wc -l)
          test "$java_count" -ge 15 || { echo "ERROR: expected complete native Java layer, found $java_count files"; exit 1; }
          for f in AtlasQaPlugin.java MainActivity.java AtlasStorage.java AtlasVersion.java AtlasZipImporter.java AtlasTaskEngine.java BuildConfigStore.java BuildService.java CharacterStorage.java GitHubApi.java ImportService.java LocalHttpServer.java MapLiveLink.java AssetLibrary.java VersionUtil.java; do test -f "$native/com/tittor/atlas/qa/manager/$f" || { echo "ERROR: missing native/$f"; exit 1; }; done
          grep -q '@CapacitorPlugin(name="AtlasQa")' "$native/com/tittor/atlas/qa/manager/AtlasQaPlugin.java"
          grep -q 'AtlasQaPlugin.class' "$native/com/tittor/atlas/qa/manager/MainActivity.java"
          grep -q 'protected void load' "$native/com/tittor/atlas/qa/manager/MainActivity.java"
          grep -q 'super.load' "$native/com/tittor/atlas/qa/manager/MainActivity.java"
          grep -q 'BuildService' "$native/AndroidManifest.xml"
          grep -q 'ImportService' "$native/AndroidManifest.xml"
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' "$native/AndroidManifest.xml"
          echo 'Native source audit: PASS'
      - name: Install project dependencies
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build Atlas web application
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          echo 'Web build: PASS'
      - name: Prepare Capacitor Android and integrate native layer
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          native="$(dirname "$PWD")/native"
          test -d "$native"
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/tittor/atlas/qa/manager
          cp -a "$native/com/tittor/atlas/qa/manager/." android/app/src/main/java/com/tittor/atlas/qa/manager/
          python - "$native/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml <<'PY'
          from pathlib import Path
          import re, sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          dst=Path(sys.argv[2])
          out=dst.read_text(encoding='utf-8')
          perms=re.findall(r'<uses-permission[^>]+android:name="([^"]+)"[^>]*/>', src)
          for perm in perms:
              if f'android:name="{perm}"' not in out:
                  out=out.replace('</manifest>', f'    <uses-permission android:name="{perm}" />\n</manifest>')
          for svc in ['ImportService','BuildService']:
              if f'android:name="com.tittor.atlas.qa.manager.{svc}"' not in out:
                  out=out.replace('</application>', f'        <service android:name="com.tittor.atlas.qa.manager.{svc}" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>')
          if 'com.tittor.atlas.qa.manager.MainActivity' not in out:
              out=re.sub(r'android:name="(?:\\.MainActivity|[^"/]+\\.MainActivity)"','android:name="com.tittor.atlas.qa.manager.MainActivity"',out,count=1)
          dst.write_text(out,encoding='utf-8')
          PY
          npx cap sync android
          catalog=android/app/src/main/assets/capacitor.plugins.json
          if test -f "$catalog"; then
            python - "$catalog" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); a=json.loads(p.read_text()); p.write_text(json.dumps([x for x in a if x.get('pkg')!='AtlasQa'],indent=2)+'\n')
          PY
          fi
          test "$(find android/app/src/main/java/com/tittor/atlas/qa/manager -type f -name '*.java' | wc -l)" -ge 15
          grep -q 'protected void load' android/app/src/main/java/com/tittor/atlas/qa/manager/MainActivity.java
          grep -q 'registerPlugin(AtlasQaPlugin.class)' android/app/src/main/java/com/tittor/atlas/qa/manager/MainActivity.java
          grep -q 'com.tittor.atlas.qa.manager.BuildService' android/app/src/main/AndroidManifest.xml
          grep -q 'com.tittor.atlas.qa.manager.ImportService' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' android/app/src/main/AndroidManifest.xml
          if test -f "$catalog" && grep -q '"pkg"[[:space:]]*:[[:space:]]*"AtlasQa"' "$catalog"; then echo 'ERROR: duplicate AtlasQa catalog registration'; exit 1; fi
          echo 'Capacitor/native integration: PASS'
      - name: Repair JavaScript string escaping in MapLiveLink
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=android/app/src/main/java/com/tittor/atlas/qa/manager/MapLiveLink.java
          test -f "$FILE"
          python - "$FILE" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          before=s
          s=re.sub(r'id="([^"]+)"', lambda m: 'id=\\"'+m.group(1)+'\\"', s)
          p.write_text(s,encoding='utf-8')
          if s==before:
              print('MapLiveLink escaping: no targeted HTML id attributes found')
          else:
              print('MapLiveLink escaping: repaired embedded HTML double quotes')
          PY
          grep -n 'id=\\"atlasPlaytestState\\"' "$FILE" >/dev/null || { echo 'ERROR: MapLiveLink Java string escaping repair did not apply'; exit 1; }
      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Final pre-build audit
        working-directory: ${{ steps.project.outputs.root }}
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -s dist/index.html
          node -e 'const p=require("./package.json"); if(p.version!==process.env.VERSION_LABEL) throw new Error(`version drift: ${p.version} != ${process.env.VERSION_LABEL}`)'
          grep -q 'registerPlugin(AtlasQaPlugin.class)' android/app/src/main/java/com/tittor/atlas/qa/manager/MainActivity.java
          grep -q '@CapacitorPlugin(name="AtlasQa")' android/app/src/main/java/com/tittor/atlas/qa/manager/AtlasQaPlugin.java
          grep -q 'id=\\"atlasPlaytestState\\"' android/app/src/main/java/com/tittor/atlas/qa/manager/MapLiveLink.java
          echo 'FINAL PRE-BUILD AUDIT: PASS'
      - name: Build unsigned Android APK
        working-directory: ${{ steps.project.outputs.root }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Validate generated APK
        working-directory: ${{ steps.project.outputs.root }}
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit 2>/dev/null || true)"
          test -n "$APKANALYZER"
          "$APKANALYZER" apk summary "$APK"
          "$APKANALYZER" manifest application-id "$APK" | grep -q 'com.tittor.atlas.qa'
          "$APKANALYZER" manifest version-name "$APK" | grep -q "$VERSION_LABEL"
          DEX="$($APKANALYZER dex packages --defined-only "$APK")"
          for cls in AtlasQaPlugin BuildService ImportService MainActivity; do echo "$DEX" | grep -q "$cls" || { echo "ERROR: $cls missing from DEX"; exit 1; }; done
          cp "$APK" /tmp/Atlas-unsigned.apk
          echo 'APK validation: PASS'
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/Atlas-unsigned.apk
          retention-days: 1

  sign-release:
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/unsigned
      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Sign and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          TAG: ${{ inputs.source_release_tag }}
          VERSION_LABEL: ${{ inputs.version_label }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" >/dev/null
          BT="$ANDROID_HOME/build-tools/35.0.0"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/atlas-release.p12
          APK_IN="$(find /tmp/unsigned -type f -name '*.apk' -print -quit)"
          test -n "$APK_IN"
          APK_OUT="/tmp/Atlas-v${VERSION_LABEL}-release.apk"
          "$BT/apksigner" sign --ks /tmp/atlas-release.p12 --ks-type PKCS12 --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out "$APK_OUT" "$APK_IN"
          "$BT/apksigner" verify --verbose "$APK_OUT"
          sha256sum "$APK_OUT" > "$APK_OUT.sha256"
          printf 'Atlas QA Character Studio v%s\nSigned APK generated by GitHub Actions.\n' "$VERSION_LABEL" > "$APK_OUT.txt"
          gh release upload "$TAG" "$APK_OUT" "$APK_OUT.sha256" "$APK_OUT.txt" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published Atlas-v${VERSION_LABEL}-release.apk to release $TAG"
