name: Atlas ZIP to APK
run-name: Atlas APK ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Temporary release tag containing the source ZIP
        required: true
        type: string
      source_asset_name:
        description: Source ZIP asset name
        required: true
        type: string
      version_label:
        description: Human-readable version label
        required: true
        type: string
      request_id:
        description: Unique build request ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/atlas-source /tmp/atlas-work
          mkdir -p /tmp/atlas-source /tmp/atlas-work
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_ASSET" --dir /tmp/atlas-source
          test -s "/tmp/atlas-source/$SOURCE_ASSET"
          unzip -q "/tmp/atlas-source/$SOURCE_ASSET" -d /tmp/atlas-work
      - name: Locate Atlas project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          root=""
          while IFS= read -r -d '' pkg; do
            if node -e 'const p=require(process.argv[1]); process.exit((p.scripts && p.scripts.build) ? 0 : 1)' "$pkg"; then
              root="$(dirname "$pkg")"
              break
            fi
          done < <(find /tmp/atlas-work -type f -name package.json -not -path '*/node_modules/*' -print0)
          test -n "$root" || { echo "ERROR: no se encontró package.json con script build"; exit 1; }
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Atlas web project root: $root"
          test -f "$root/package.json"

          android_root=""
          if test -f "$root/android/gradlew"; then
            android_root="$root/android"
          elif test -d "$root/android"; then
            android_root="$root/android"
          else
            candidate="$(find "$(dirname "$root")" -type f -path '*/android/gradlew' -print -quit 2>/dev/null || true)"
            if test -n "$candidate"; then android_root="$(dirname "$candidate")"; fi
          fi
          if test -z "$android_root"; then
            candidate="$(find /tmp/atlas-work -type f -path '*/android/gradlew' -print -quit 2>/dev/null || true)"
            if test -n "$candidate"; then android_root="$(dirname "$candidate")"; fi
          fi
          echo "android_root=$android_root" >> "$GITHUB_OUTPUT"
          if test -n "$android_root"; then
            echo "Atlas Android source root: $android_root"
          else
            echo "Atlas Android source root: NONE (will be generated by Capacitor)"
          fi
      - name: Audit AtlasQa native integration
        working-directory: ${{ steps.project.outputs.root }}
        env:
          ANDROID_ROOT: ${{ steps.project.outputs.android_root }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== AtlasQa native integration audit ==="
          PLUGIN="$(find /tmp/atlas-work -type f -name 'AtlasQaPlugin.java' -print -quit 2>/dev/null || true)"
          if test -n "$ANDROID_ROOT"; then
            if test -z "$PLUGIN"; then PLUGIN="$(find "$ANDROID_ROOT" -type f -name 'AtlasQaPlugin.java' -print -quit 2>/dev/null || true)"; fi
          fi
          test -n "$PLUGIN" || { echo "ERROR: AtlasQaPlugin.java not found in ZIP"; find /tmp/atlas-work -type f -name '*.java' | head -80; exit 1; }
          grep -q '@CapacitorPlugin(name="AtlasQa")' "$PLUGIN" || { echo "ERROR: @CapacitorPlugin(name=\"AtlasQa\") not found"; exit 1; }
          MAIN="$(find /tmp/atlas-work -type f -name 'MainActivity.java' -print -quit 2>/dev/null || true)"
          if test -z "$MAIN" && test -n "$ANDROID_ROOT"; then MAIN="$(find "$ANDROID_ROOT" -type f -name 'MainActivity.java' -print -quit 2>/dev/null || true)"; fi
          test -n "$MAIN" || { echo "ERROR: MainActivity.java not found in ZIP"; exit 1; }
          grep -q 'AtlasQaPlugin.class' "$MAIN" || { echo "ERROR: MainActivity does not register AtlasQaPlugin.class"; exit 1; }
          grep -R -q "registerPlugin('AtlasQa')\|registerPlugin(\"AtlasQa\")" "$root" --exclude-dir=node_modules --exclude-dir=dist || { echo "ERROR: web registerPlugin('AtlasQa') not found"; exit 1; }
          echo "AtlasQa native/web integration: PASS"
          echo "Plugin: $PLUGIN"
          echo "MainActivity: $MAIN"
      - name: Install project dependencies
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Build Atlas web application
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          echo "Web bundle: PASS"
      - name: Prepare Capacitor Android
        working-directory: ${{ steps.project.outputs.root }}
        env:
          ANDROID_ROOT: ${{ steps.project.outputs.android_root }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Preparing Capacitor Android ==="
          SOURCE_ANDROID="$ANDROID_ROOT"
          if test -z "$SOURCE_ANDROID"; then
            echo "No native Android project supplied; generating one with Capacitor"
            npx cap add android
          elif test ! -f "$SOURCE_ANDROID/gradlew"; then
            echo "Native Android sources exist but Gradle wrapper is missing; generating wrapper project"
            rm -rf /tmp/atlas-native-source
            cp -a "$SOURCE_ANDROID" /tmp/atlas-native-source
            rm -rf android
            npx cap add android
            if test -d /tmp/atlas-native-source/app/src/main; then
              cp -a /tmp/atlas-native-source/app/src/main/. android/app/src/main/
            fi
            if test -f /tmp/atlas-native-source/app/build.gradle; then cp /tmp/atlas-native-source/app/build.gradle android/app/build.gradle; fi
            if test -f /tmp/atlas-native-source/app/build.gradle.kts; then cp /tmp/atlas-native-source/app/build.gradle.kts android/app/build.gradle.kts; fi
            if test -f /tmp/atlas-native-source/variables.gradle; then cp /tmp/atlas-native-source/variables.gradle android/variables.gradle; fi
            if test -f /tmp/atlas-native-source/settings.gradle; then cp /tmp/atlas-native-source/settings.gradle android/settings.gradle; fi
            if test -f /tmp/atlas-native-source/settings.gradle.kts; then cp /tmp/atlas-native-source/settings.gradle.kts android/settings.gradle.kts; fi
          else
            echo "Using supplied Android project with Gradle wrapper"
          fi
          test -f android/gradlew
          PLUGIN_SOURCE="$(find /tmp/atlas-work -type f -name 'AtlasQaPlugin.java' -print -quit 2>/dev/null || true)"
          if test -n "$PLUGIN_SOURCE"; then
            REL="${PLUGIN_SOURCE#/tmp/atlas-work/}"
            if [[ "$REL" == */app/src/main/java/* ]]; then
              DEST="android/app/src/main/java/${REL#*/app/src/main/java/}"
              mkdir -p "$(dirname "$DEST")"
              cp "$PLUGIN_SOURCE" "$DEST"
            fi
          fi
          PLUGIN_CATALOG="android/app/src/main/assets/capacitor.plugins.json"
          BACKUP="/tmp/atlas-capacitor.plugins.json"
          if test -f "$PLUGIN_CATALOG"; then cp "$PLUGIN_CATALOG" "$BACKUP"; fi
          npx cap sync android
          if test -f "$BACKUP"; then cp "$BACKUP" "$PLUGIN_CATALOG"; fi
          test -f "$PLUGIN_CATALOG"
          grep -q 'AtlasQa' "$PLUGIN_CATALOG" || { echo "ERROR: AtlasQa missing from capacitor.plugins.json"; exit 1; }
          grep -R -q 'AtlasQaPlugin.class' android/app/src/main/java || { echo "ERROR: AtlasQaPlugin registration missing after sync"; exit 1; }
          echo "Capacitor Android preparation: PASS"
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned Android APK
        working-directory: ${{ steps.project.outputs.root }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Locate generated APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" /tmp/Atlas-unsigned.apk
          test -s /tmp/Atlas-unsigned.apk
          echo "Generated APK: $apk"
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/Atlas-unsigned.apk
          retention-days: 1

  sign-release:
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/unsigned
      - name: Restore Atlas master signing key
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATLAS_KEYSTORE_BASE64"
          printf '%s' "$ATLAS_KEYSTORE_BASE64" | base64 --decode > /tmp/atlas-release.p12
          test -s /tmp/atlas-release.p12
      - name: Verify master signing key
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -storetype PKCS12 -keystore /tmp/atlas-release.p12 -storepass "$ATLAS_STORE_PASSWORD" -alias "$ATLAS_KEY_ALIAS" >/dev/null
      - name: Sign APK with Atlas key
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/unsigned/Atlas-unsigned.apk
          ALIGNED=/tmp/Atlas-aligned.apk
          OUT="Atlas-v${{ inputs.version_label }}-release.apk"
          TXT="Atlas-v${{ inputs.version_label }}-release.txt"
          SHA="${OUT}.sha256"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign --ks /tmp/atlas-release.p12 --ks-type PKCS12 --ks-pass "pass:$ATLAS_STORE_PASSWORD" --key-pass "pass:$ATLAS_KEY_PASSWORD" --ks-key-alias "$ATLAS_KEY_ALIAS" --out "$OUT" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" > /tmp/atlas-signature.txt
          {
            echo "Atlas QA Character Studio"
            echo "Version: ${{ inputs.version_label }}"
            echo "Build request: ${{ inputs.request_id }}"
            echo "Source release: ${{ inputs.source_release_tag }}"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Signed: yes"
            echo "Signing alias: $ATLAS_KEY_ALIAS"
            echo ""
            cat /tmp/atlas-signature.txt
          } > "$TXT"
          sha256sum "$OUT" > "$SHA"
          test -s "$OUT" && test -s "$TXT" && test -s "$SHA"
      - name: Publish signed package to source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ inputs.source_release_tag }}' "Atlas-v${{ inputs.version_label }}-release.apk" "Atlas-v${{ inputs.version_label }}-release.apk.sha256" "Atlas-v${{ inputs.version_label }}-release.txt" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish three-file signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-release-${{ inputs.request_id }}
          path: |
            Atlas-v${{ inputs.version_label }}-release.apk
            Atlas-v${{ inputs.version_label }}-release.apk.sha256
            Atlas-v${{ inputs.version_label }}-release.txt
          retention-days: 7
