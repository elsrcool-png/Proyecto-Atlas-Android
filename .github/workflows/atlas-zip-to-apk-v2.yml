name: Atlas ZIP to APK v2
run-name: Atlas QA Studio ${{ inputs.version_label }} | Atlas Runtime ${{ inputs.atlas_runtime_version }} | ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        required: true
        type: string
      source_asset_name:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      version_label:
        required: true
        type: string
      atlas_runtime_version:
        required: false
        default: '2.62.8'
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/src /tmp/work
          gh release download '${{ inputs.source_release_tag }}' --repo "$GITHUB_REPOSITORY" --pattern '${{ inputs.source_asset_name }}' --dir /tmp/src
          test -s "/tmp/src/${{ inputs.source_asset_name }}"
          actual=$(sha256sum "/tmp/src/${{ inputs.source_asset_name }}" | awk '{print $1}')
          test "$actual" = '${{ inputs.source_sha256 }}' || { echo "SHA256 mismatch"; exit 1; }
          unzip -q "/tmp/src/${{ inputs.source_asset_name }}" -d /tmp/work
          echo "SHA256 PASS: $actual"

      - name: Locate Atlas project
        id: project
        run: |
          set -euo pipefail
          root=''
          while IFS= read -r -d '' p; do
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.build ? 0 : 1)' "$p"; then root="$(dirname "$p")"; break; fi
          done < <(find /tmp/work -type f -name package.json -not -path '*/node_modules/*' -print0)
          test -n "$root" || { echo 'ERROR: no package.json with build script'; exit 1; }
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "ATLAS_ROOT=$root"

      - name: Install dependencies and build web
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          node - <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const has=(x)=>!!(p.dependencies?.[x]||p.devDependencies?.[x]);
          if(!has('@capacitor/core')||!has('@capacitor/android')||!has('@capacitor/cli')) process.exit(42);
          NODE
          if [ $? -eq 42 ]; then npm install @capacitor/core @capacitor/android @capacitor/cli --no-audit --no-fund; fi
          npm run build
          test -s dist/index.html

      - name: Integrate Android native layer
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          native="$(dirname "$PWD")/native"
          test -d "$native" || { echo "ERROR: native directory not found: $native"; exit 1; }
          test -f "$native/AndroidManifest.xml"
          test -f "$native/com/tittor/atlas/qa/manager/AtlasQaPlugin.java"
          test -f "$native/com/tittor/atlas/qa/manager/MainActivity.java"
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/tittor/atlas/qa/manager
          cp -a "$native/com/tittor/atlas/qa/manager/." android/app/src/main/java/com/tittor/atlas/qa/manager/
          if test -d "$native/assets"; then mkdir -p android/app/src/main/assets; cp -a "$native/assets/." android/app/src/main/assets/; fi
          cp "$native/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          if test -f "$native/strings.xml"; then mkdir -p android/app/src/main/res/values; cp "$native/strings.xml" android/app/src/main/res/values/strings.xml; fi
          python - android/app/build.gradle '${{ inputs.version_label }}' <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); v=sys.argv[2]; s=p.read_text()
          a=v.split('.')
          code=int(a[0])*10000+int(a[1])*100+int(a[2])
          s=re.sub(r'(?m)^\s*versionCode\s+.*$',f'        versionCode {code}',s,count=1)
          s=re.sub(r'(?m)^\s*versionName\s+.*$',f'        versionName "{v}"',s,count=1)
          p.write_text(s)
          PY
          npx cap sync android
          grep -q 'com.tittor.atlas.qa.manager.MainActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'AtlasQaPlugin.class' android/app/src/main/java/com/tittor/atlas/qa/manager/MainActivity.java

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile and build unsigned APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon
          ./gradlew clean assembleDebug --no-daemon
          apk=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -s "$apk"
          cp "$apk" /tmp/Atlas-unsigned.apk

      - name: Validate APK
        run: |
          set -euo pipefail
          apkanalyzer=$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)
          "$apkanalyzer" manifest application-id /tmp/Atlas-unsigned.apk | grep -q 'com.tittor.atlas.qa'
          "$apkanalyzer" manifest version-name /tmp/Atlas-unsigned.apk | grep -q '${{ inputs.version_label }}'

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/Atlas-unsigned.apk
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-unsigned-${{ inputs.request_id }}
          path: /tmp/unsigned
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Restore Atlas signing key
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ATLAS_KEYSTORE_BASE64"
          printf '%s' "$ATLAS_KEYSTORE_BASE64" | base64 --decode > /tmp/atlas-release.p12
          test -s /tmp/atlas-release.p12
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Sign and publish
        env:
          STORE_PASS: ${{ secrets.ATLAS_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ATLAS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zipalign=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          out="Atlas_QA_Character_Studio_v${{ inputs.version_label }}_Atlas_${{ inputs.atlas_runtime_version }}.apk"
          sha="$out.sha256"
          txt="Atlas_QA_Character_Studio_v${{ inputs.version_label }}_Atlas_${{ inputs.atlas_runtime_version }}.txt"
          "$zipalign" -f -p 4 /tmp/unsigned/Atlas-unsigned.apk /tmp/aligned.apk
          "$apksigner" sign --ks /tmp/atlas-release.p12 --ks-type PKCS12 --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out "$out" /tmp/aligned.apk
          "$apksigner" verify --verbose --print-certs "$out" > /tmp/sig.txt
          sha256sum "$out" > "$sha"
          { echo 'Atlas QA Character Studio'; echo 'Studio version: ${{ inputs.version_label }}'; echo 'Atlas runtime: ${{ inputs.atlas_runtime_version }}'; echo 'Application ID: com.tittor.atlas.qa'; echo 'Signed: yes'; echo "Source SHA256: ${{ inputs.source_sha256 }}"; echo "Workflow run: $GITHUB_RUN_ID"; echo; cat /tmp/sig.txt; } > "$txt"
          gh release upload '${{ inputs.source_release_tag }}' "$out" "$sha" "$txt" --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p /tmp/release
          cp "$out" "$sha" "$txt" /tmp/release/
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-release-${{ inputs.request_id }}
          path: /tmp/release/*
          retention-days: 30
