name: Atlas QA 4.4.1 + Atlas 2.62.8 | Dedicated Builder FIXED
run-name: Atlas QA 4.4.1 + Atlas 2.62.8 | ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Release tag containing the verified Studio ZIP
        required: true
        type: string
      source_asset_name:
        description: Exact verified Studio ZIP filename
        required: true
        type: string
      source_sha256:
        description: SHA-256 of the verified Studio ZIP
        required: true
        type: string
      request_id:
        description: Unique build identifier
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  STUDIO_VERSION: '4.4.1'
  ATLAS_RUNTIME_VERSION: '2.62.8'
  APPLICATION_ID: 'com.tittor.atlas.qa'
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    name: Build and validate unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Download and verify source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/atlas-source /tmp/atlas-work /tmp/atlas-artifacts
          mkdir -p /tmp/atlas-source /tmp/atlas-work /tmp/atlas-artifacts
          gh release download '${{ inputs.source_release_tag }}' --repo "$GITHUB_REPOSITORY" --pattern '${{ inputs.source_asset_name }}' --dir /tmp/atlas-source
          ZIP="/tmp/atlas-source/${{ inputs.source_asset_name }}"
          test -s "$ZIP"
          ACTUAL_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL_SHA" = '${{ inputs.source_sha256 }}'
          unzip -q "$ZIP" -d /tmp/atlas-work
          echo "SOURCE_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "SOURCE SHA256 PASS: $ACTUAL_SHA"

      - name: Discover and lock Studio root
        id: studio
        run: |
          set -euo pipefail
          root=""
          while IFS= read -r -d '' p; do
            candidate="$(dirname "$(dirname "$p")")"
            if test -d "$candidate/atlas-integrated-source" && test -f "$candidate/atlas-integrated-source/ATLAS_INTEGRATION_VERSION.txt" && test -f "$candidate/native/AndroidManifest.xml" && test -f "$candidate/native/com/tittor/atlas/qa/manager/AtlasQaPlugin.java"; then root="$candidate"; break; fi
          done < <(find /tmp/atlas-work -type f -path '*/web/package.json' -not -path '*/node_modules/*' -print0)
          test -n "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "STUDIO ROOT: $root"

      - name: Assert exact target contract
        working-directory: ${{ steps.studio.outputs.root }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < atlas-integrated-source/ATLAS_INTEGRATION_VERSION.txt)" = "$ATLAS_RUNTIME_VERSION"
          node -e "const s=require('./web/package.json'),a=require('./atlas-integrated-source/package.json'); if(!s.scripts?.build) throw Error('Studio build missing'); if(!a.scripts?.build) throw Error('Atlas build missing'); console.log('TARGET CONTRACT PASS')"

      - name: Install Studio dependencies
        working-directory: ${{ steps.studio.outputs.root }}/web
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Build Atlas 2.62.8
        working-directory: ${{ steps.studio.outputs.root }}/atlas-integrated-source
        run: |
          set -euo pipefail
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          test -s dist/index.html
          echo 'ATLAS 2.62.8 BUILD PASS'

      - name: Replace bundled runtime
        working-directory: ${{ steps.studio.outputs.root }}
        run: |
          set -euo pipefail
          rm -rf web/public/bundled-game/site
          mkdir -p web/public/bundled-game/site
          cp -a atlas-integrated-source/dist/. web/public/bundled-game/site/
          test -s web/public/bundled-game/site/index.html

      - name: Build Studio web application
        working-directory: ${{ steps.studio.outputs.root }}/web
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          echo 'STUDIO WEB BUILD PASS'

      - name: Prepare Capacitor Android
        working-directory: ${{ steps.studio.outputs.root }}/web
        run: |
          set -euo pipefail
          test -x node_modules/.bin/cap || npm install @capacitor/core @capacitor/android @capacitor/cli --no-audit --no-fund
          npx cap --version
          rm -rf android
          npx cap add android
          test -d android/app/src/main

      - name: Integrate frozen 4.4.0 native QA layer
        working-directory: ${{ steps.studio.outputs.root }}/web
        run: |
          set -euo pipefail
          NATIVE="$(dirname "$PWD")/native"
          DEST="android/app/src/main/java/com/tittor/atlas/qa/manager"
          test -f "$NATIVE/AndroidManifest.xml"
          test -f "$NATIVE/com/tittor/atlas/qa/manager/MainActivity.java"
          test -f "$NATIVE/com/tittor/atlas/qa/manager/AtlasQaPlugin.java"
          mkdir -p "$DEST"
          cp -a "$NATIVE/com/tittor/atlas/qa/manager/." "$DEST/"
          python - "$NATIVE/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(); dst=Path(sys.argv[2]); out=dst.read_text()
          for perm in re.findall(r'<uses-permission[^>]+android:name="([^"]+)"[^>]*/>',src):
              if f'android:name="{perm}"' not in out: out=out.replace('</manifest>',f'    <uses-permission android:name="{perm}" />\n</manifest>')
          out=out.replace('android:name=".MainActivity"','android:name="com.tittor.atlas.qa.manager.MainActivity"').replace('android:name="MainActivity"','android:name="com.tittor.atlas.qa.manager.MainActivity"')
          dst.write_text(out)
          PY
          grep -q 'com.tittor.atlas.qa.manager.MainActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'AtlasQaPlugin.class' android/app/src/main/java/com/tittor/atlas/qa/manager/MainActivity.java
          echo 'NATIVE QA LAYER PASS'

      - name: Configure exact Android identity
        working-directory: ${{ steps.studio.outputs.root }}/web/android
        run: |
          set -euo pipefail
          python - app/build.gradle "$STUDIO_VERSION" "$APPLICATION_ID" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); version=sys.argv[2]; appid=sys.argv[3]; parts=version.split('.')
          code=int(parts[0])*10000+int(parts[1])*100+int(parts[2])
          s=p.read_text()
          s=re.sub(r'(?m)^\s*versionCode\s+.*$',f'        versionCode {code}',s,count=1)
          s=re.sub(r'(?m)^\s*versionName\s+.*$',f'        versionName "{version}"',s,count=1)
          s=re.sub(r'(?m)^\s*applicationId\s+["\'][^"\']+["\']',f'        applicationId "{appid}"',s,count=1)
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew --version

      - name: Capacitor sync and Gradle preflight
        working-directory: ${{ steps.studio.outputs.root }}/web
        run: |
          set -euo pipefail
          npx cap sync android
          cd android
          echo '=== GRADLE VERSION ==='
          ./gradlew --version
          echo '=== GRADLE TASK DISCOVERY ==='
          if ! ./gradlew :app:tasks --all --no-daemon --stacktrace --console=plain >/tmp/gradle-tasks.txt 2>&1; then
            cat /tmp/gradle-tasks.txt
            exit 1
          fi
          cat /tmp/gradle-tasks.txt
          if ! grep -Eq '^assembleDebug($|\s)' /tmp/gradle-tasks.txt; then
            echo 'ERROR: assembleDebug task not found'
            exit 1
          fi
          echo 'GRADLE PREFLIGHT PASS'

      - name: Compile and assemble debug APK
        working-directory: ${{ steps.studio.outputs.root }}/web/android
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace --console=plain
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          cp "$APK" /tmp/atlas-artifacts/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8_unsigned.apk
          echo 'DEBUG APK BUILD PASS'

      - name: Validate unsigned APK
        run: |
          set -euo pipefail
          APK=/tmp/atlas-artifacts/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8_unsigned.apk
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          test -x "$APKANALYZER"
          echo '=== APK VALIDATION ==='
          echo "APK: $APK"
          echo "APK SIZE: $(stat -c%s "$APK") bytes"
          echo "APK ANALYZER: $APKANALYZER"
          APP_ID_ACTUAL="$("$APKANALYZER" manifest application-id "$APK" | tr -d '\r' | sed -n '1p' | sed 's/[[:space:]]*$//')"
          VERSION_ACTUAL="$("$APKANALYZER" manifest version-name "$APK" | tr -d '\r' | sed -n '1p' | sed 's/[[:space:]]*$//')"
          echo "APPLICATION_ID EXPECTED: $APPLICATION_ID"
          echo "APPLICATION_ID ACTUAL:   $APP_ID_ACTUAL"
          echo "VERSION EXPECTED:        $STUDIO_VERSION"
          echo "VERSION ACTUAL:          $VERSION_ACTUAL"
          if test "$APP_ID_ACTUAL" != "$APPLICATION_ID"; then
            echo 'ERROR: applicationId validation failed'
            echo 'Raw applicationId output:'
            "$APKANALYZER" manifest application-id "$APK" || true
            exit 1
          fi
          if test "$VERSION_ACTUAL" != "$STUDIO_VERSION"; then
            echo 'ERROR: versionName validation failed'
            echo 'Raw versionName output:'
            "$APKANALYZER" manifest version-name "$APK" || true
            exit 1
          fi
          if ! unzip -l "$APK" | grep -Eq 'assets/(public/)?index\.html'; then
            echo 'ERROR: packaged index.html missing from APK'
            exit 1
          fi
          echo 'ASSETS INDEX PASS'
          echo 'UNSIGNED APK VALIDATION PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-qa-4.4.1-2.62.8-unsigned
          path: /tmp/atlas-artifacts/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8_unsigned.apk
          if-no-files-found: error

  sign:
    name: Sign and publish APK
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: atlas-qa-4.4.1-2.62.8-unsigned
          path: /tmp/atlas-sign
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/atlas-sign/atlas-release.keystore
          test -s /tmp/atlas-sign/atlas-release.keystore
      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=/tmp/atlas-sign/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8_unsigned.apk
          OUT=/tmp/atlas-sign/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8.apk
          APKSIGNER="$(find "$ANDROID_HOME" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks /tmp/atlas-sign/atlas-release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$OUT" "$APK"
          "$APKSIGNER" verify --verbose "$OUT"
          test -s "$OUT"
          echo 'SIGNED APK PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-qa-4.4.1-2.62.8-signed
          path: /tmp/atlas-sign/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8.apk
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="atlas-qa-4.4.1-2.62.8-${GITHUB_RUN_ID}"
          gh release create "$TAG" /tmp/atlas-sign/Atlas_QA_Character_Studio_v4.4.1_Atlas_2.62.8.apk --repo "$GITHUB_REPOSITORY" --title "Atlas QA 4.4.1 + Atlas 2.62.8 #${GITHUB_RUN_NUMBER}" --notes "Automated signed APK build. Source tag: ${{ inputs.source_release_tag }}. Source SHA256: ${{ inputs.source_sha256 }}."